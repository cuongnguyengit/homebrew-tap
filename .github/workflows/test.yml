name: Homebrew macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install and test published formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew tap cuongnguyengit/tap "$GITHUB_WORKSPACE"
          brew install --build-from-source cuongnguyengit/tap/cc-auto
          brew test cuongnguyengit/tap/cc-auto
          cc-auto --version
          cc-account --help
          cc-auto --help
